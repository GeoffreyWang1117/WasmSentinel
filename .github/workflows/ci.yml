name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  go:
    name: Go host · build / vet / gofmt / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: host/go.sum
      - name: Build every package (uses the committed bpf2go bindings)
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: Test
        run: go test -race ./...

  wasm-rules:
    name: Wasm rule · ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [rules/sentinel-abi, rules/suspicious-shell, rules/ml-detector]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: rustfmt
        run: cargo fmt --check
      - name: Unit tests (native target)
        run: cargo test --release
      - name: Build Wasm module
        run: cargo build --release --target wasm32-wasip1
      - name: Model parity, NumPy reference vs Wasm module (ml-detector only)
        if: matrix.crate == 'rules/ml-detector'
        run: |
          python3 -m pip install --quiet --user wasmtime numpy
          python3 train/verify_wasm_parity.py --wasm target/wasm32-wasip1/release/ml_detector.wasm --count 1000 --adfa-count 0
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ strategy.job-index }}
          path: ${{ matrix.crate }}/target/wasm32-wasip1/release/*.wasm
          if-no-files-found: ignore # sentinel-abi is an rlib, no .wasm

  ebpf:
    name: eBPF program · compile + bindings up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: host/go.sum
      - name: Install clang / llvm
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends clang llvm libbpf-dev
      - name: Regenerate bpf2go bindings
        working-directory: host/internal/ebpf
        run: go generate ./...
      - name: Go bindings match the committed ones
        run: git diff --exit-code -- host/internal/ebpf/sentinel_bpfel.go
      - name: Build with the regenerated object
        working-directory: host
        run: go build ./internal/ebpf/

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go, wasm-rules, ebpf]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: host/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Build host binary and Wasm rules
        run: ./scripts/build.sh
      - name: Package
        run: |
          mkdir -p release/rules
          cp wasmsentinel release/
          cp rules/wasm/*.wasm release/rules/
          cp README.md LICENSE release/
          tar -czf wasmsentinel-${{ github.ref_name }}-linux-amd64.tar.gz -C release .
      - uses: softprops/action-gh-release@v2
        with:
          files: wasmsentinel-${{ github.ref_name }}-linux-amd64.tar.gz
          generate_release_notes: true
