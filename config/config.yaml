# WasmSentinel 配置文件示例

# 规则配置
rules: "./rules"

# 日志配置
log-level: "info"
# 留空 = 写 stdout，由容器运行时（Docker json-file 驱动）轮转；指定文件路径时程序自身不做轮转。
log-file: ""

# 输出配置
webhook: "http://localhost:8081/alerts"
metrics-port: 8080

# 规则沙箱限额（每条规则一个长寿 Wasm 实例；三项互相独立，0 = 关闭该项）
rule-memory-mb: 64      # 线性内存上限 (MiB)，超出后 guest 内的分配失败并被记为 memory trap
rule-fuel: 50000000     # 每次 detect 调用的指令预算 (wasmtime fuel)
rule-timeout: 100ms     # 每次 detect 调用的墙钟超时（epoch 中断）
# 交给规则的事件编码：json（默认）或 binary。binary 只对 eBPF 事件生效且规则需导出 detect_raw，
# 否则该规则自动回退 json；两条路径对同一事件给出相同结果（见 rules/sentinel-abi）。
event-encoding: json

# 事件采集器：proc = /proc 轮询（无需特权）；ebpf = 内核钩子（需要 root 与 BTF 内核）；
# replay = 回放 syscall 轨迹（配合 replay-file / replay-eps / replay-loop，轨迹播完即退出）
collector: proc
# ebpf 钩子列表（collector=ebpf 时生效）：exec,exit,open,connect,accept,syscall 或 all
ebpf-hooks: all

# 收集器配置（proc 模式）
collectors:
  process:
    enabled: true
    scan_interval: 1s
  network:
    enabled: true
    scan_interval: 10s
  file:
    enabled: false
    watch_paths:
      - "/etc"
      - "/var/log"
      - "/home"

# 规则配置
rule_config:
  suspicious-shell:
    enabled: true
    threshold: 5
  opa-policy:
    enabled: false
    
# 过滤器配置  
filters:
  # 排除的进程
  exclude_processes:
    - "systemd"
    - "kthread"
    - "[ksoftirqd"
  
  # 排除的用户
  exclude_users:
    - "root"   # 可选排除 root
    
  # 最小威胁级别
  min_threat_level: 3
