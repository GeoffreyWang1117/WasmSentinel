[package]
name = "ml-detector"
version = "0.1.0"
edition = "2021"
description = "WasmML: Lightweight ML-based threat detection in Wasm sandbox"
authors = ["WasmSentinel Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sentinel-abi = { path = "../sentinel-abi" }

# Lightweight ML inference for Wasm
# Using tract for ONNX model inference (optional, can fallback to pure Rust impl)
# tract-onnx = { version = "0.21", default-features = false, optional = true }

[features]
default = []
# Enable ONNX model inference (may have Wasm compatibility issues)
# onnx = ["tract-onnx"]

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
# Reduce binary size for Wasm
codegen-units = 1
strip = true
