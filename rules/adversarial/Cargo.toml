[workspace]
resolver = "2"
members = [
    "fs_read",
    "env_leak",
    "net_connect",
    "stdout_flood",
    "clock",
    "mem_bomb_graceful",
    "mem_bomb_abort",
    "cpu_spin",
    "proc_exit",
    "stack_overflow",
]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
