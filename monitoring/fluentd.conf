<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<source>
  @type tail
  path /var/log/wasmsentinel.log
  pos_file /tmp/wasmsentinel.log.pos
  tag wasm.threat.detector
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%N%z
  </parse>
</source>

<filter wasm.**>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    service wasmsentinel
  </record>
</filter>

<match wasm.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix wasmsentinel
  include_timestamp true
  <buffer>
    @type memory
    flush_interval 5s
    chunk_limit_size 5m
    retry_max_interval 30
    retry_forever false
  </buffer>
</match>

<match **>
  @type stdout
</match>
