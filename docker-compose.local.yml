# 本地测试用的精简 docker-compose 配置
# 使用方式: docker compose -f docker-compose.local.yml up -d

services:
  # 威胁检测器
  wasmsentinel:
    logging:            # bound container stdout/stderr: 5 x 20 MB, then rotate
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    image: wasmsentinel:latest
    container_name: wasmsentinel
    restart: unless-stopped
    privileged: true
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - ./logs:/var/log
      - ./config:/etc/wasmsentinel:ro
    environment:
      - LOG_LEVEL=info
      - METRICS_PORT=8080
    command: >
      --config /etc/wasmsentinel/config.yaml
      --log-level info
      --metrics-port 8080
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=24h'
      - '--web.enable-lifecycle'

networks:
  default:
    name: wasmsentinel-test-network
